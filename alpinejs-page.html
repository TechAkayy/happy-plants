<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
        <title>An AlpineJS Page</title>
        <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
        <link rel="pg-require" href="pinegrow.json"/>
        <link href="bootstrap_theme/bootstrap.css" rel="stylesheet" type="text/css"/>
        <link rel="stylesheet" href="https://alpinejs.dev/build/assets/app.123d757f.css"/>
    </head>
    <body>
        <main>
            <div x-data="{ message: 'A Fresh Start!' }" x-init="message = 'A Good Day!'">
                <template x-if="true">
                    <template x-for="index in 4" :key="index">
                        <div style="
              display: flex;
              flex-direction: row;
              align-items: center;
              justify-content: center;
              padding-top: 1.5rem /* 24px */;
              padding-bottom: 1.5rem /* 24px */;
            ">
                            <span x-text="message"></span>
                        </div>
                    </template>
                </template>
                <div class="flex justify-center">
                    <div x-data="{
          open: false,
          toggle() {
              if (this.open) {
                  return this.close()
              }

              this.$refs.button.focus()

              this.open = true
          },
          close(focusAfter) {
              if (! this.open) return

              this.open = false

              focusAfter && focusAfter.focus()
          }
      }" x-on:keydown.escape.prevent.stop="close($refs.button)" x-on:focusin.window="! $refs.panel.contains($event.target) && close()" x-id="['dropdown-button']" class="relative">
                        <!-- Button -->
                        <button x-ref="button" x-on:click="toggle()" :aria-expanded="open" :aria-controls="$id('dropdown-button')" type="button" class="flex items-center gap-2 bg-white px-5 py-2.5 rounded-md shadow">
                            Options
                            <!-- Heroicon: chevron-down -->
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"/>
                            </svg>
                        </button>
                        <!-- Panel -->
                        <div x-ref="panel" x-show="open" x-transition.origin.top.left x-on:click.outside="close($refs.button)" :id="$id('dropdown-button')" style="display: none" class="absolute left-0 mt-2 w-40 rounded-md bg-white shadow-md"><a href="#" class="flex items-center gap-2 w-full first-of-type:rounded-t-md last-of-type:rounded-b-md px-4 py-2.5 text-left text-sm hover:bg-gray-50 disabled:text-gray-500">
                New Task </a><a href="#" class="flex items-center gap-2 w-full first-of-type:rounded-t-md last-of-type:rounded-b-md px-4 py-2.5 text-left text-sm hover:bg-gray-50 disabled:text-gray-500">
                Edit Task </a><a href="#" class="flex items-center gap-2 w-full first-of-type:rounded-t-md last-of-type:rounded-b-md px-4 py-2.5 text-left text-sm hover:bg-gray-50 disabled:text-gray-500"> <span class="text-red-600">Delete Task</span> </a>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </body>
</html>
