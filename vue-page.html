<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
        <title>A Vue Page</title>
        <link rel="pg-require" href="pinegrow.json"/>
        <link href="bootstrap_theme/bootstrap.css" rel="stylesheet" type="text/css">
    </head>
    <body>
        <main>
            <div id="app">
                <ol>
                    <!--
      We are providing each todo-item with the todo object
      it's representing, so that its content can be dynamic.
      We also need to provide each component with a "key",
      which is explained in the guide section on v-for.
    -->
                    <todo-item v-for="item in groceryList" :todo="item" :key="item.id"></todo-item>
                </ol>
            </div>
        </main>
        <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
        <script type="module">

import TodoItem from './TodoItem.js'

  const { createApp, ref } = Vue

createApp({
  components: {
    TodoItem
  },
  setup() {
    const groceryList = ref([
      { id: 0, text: 'Vegetables' },
      { id: 1, text: 'Cheese' },
      { id: 2, text: 'Whatever else humans are supposed to eat' }
    ])

    return {
      groceryList
    }
  }
}).mount('#app')
</script>
    </body>
</html>
